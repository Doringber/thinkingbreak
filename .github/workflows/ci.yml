name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Build (verify paths, parse modules, compile extensions)
        run: npm run build

      - name: Test
        run: npm test

      - name: Shell script syntax
        run: |
          for script in install.sh install-terminal.sh uninstall.sh; do
            bash -n "$script"
            echo "ok $script"
          done
