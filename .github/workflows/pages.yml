# Deploy Thinking Break to GitHub Pages.
#
# The repository root *is* the site — hand-written HTML/CSS and native ES
# modules, no bundler — so the job verifies the paths and uploads the tree
# as-is. `.nojekyll` stops Jekyll from swallowing directories it dislikes.
#
# Published at https://doringber.github.io/thinkingbreak/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify paths and branding
        run: node tools/verify-paths.js
      - name: Run tests
        run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # This project is served from a project path (/thinkingbreak/), and every
      # absolute URL it hands out — the install command, the extensions'
      # default gameUrl — is built on that. A custom domain silently moves the
      # site to that domain's root and breaks all of them, so the repository
      # declares the default domain as canonical and clears anything else.
      #
      # Runs before configure-pages so the same run publishes to the corrected
      # URL. Never fails the deploy: if the token is not allowed to change the
      # setting, the assertion after deployment reports it with instructions.
      - name: Enforce the canonical Pages domain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""' 2>/dev/null || echo "")
          if [ -z "$current" ]; then
            echo "✓ no custom domain configured"
            # Still make sure HTTPS is enforced. Clearing a custom domain
            # resets that flag, so a repository that has been through this once
            # can be left serving plain http on the default domain.
            enforced=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.https_enforced // false' 2>/dev/null || echo "true")
            if [ "$enforced" != "true" ]; then
              echo "HTTPS not enforced — turning it on"
              printf '{"https_enforced":true}' | gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" --input - \
                && echo "✓ HTTPS enforced" \
                || echo "::warning::Could not enable Enforce HTTPS; set it under Settings → Pages."
            fi
            exit 0
          fi

          echo "custom domain currently set to: $current"
          echo "clearing it so the site serves from the default domain…"
          # Clearing a custom domain also resets https_enforced, so turn it
          # back on in the same call — *.github.io always supports HTTPS.
          if printf '{"cname":null,"https_enforced":true}' | gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" --input - ; then
            after=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""' 2>/dev/null || echo "")
            if [ -z "$after" ]; then
              echo "✓ custom domain removed"
              echo "Removed the \`$current\` custom domain; the site will serve from the default GitHub Pages domain." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::API accepted the request but the custom domain is still '$after'."
            fi
          else
            echo "::warning title=Could not clear the custom domain::GITHUB_TOKEN was refused. Remove '$current' by hand under Settings → Pages → Custom domain."
          fi

      # `enablement` turns Pages on for the repository if it is not already,
      # so a fresh clone deploys without anyone visiting the settings page.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages queue has repeatedly held this deployment past the
          # 10-minute default and aborted a build that was otherwise fine
          # (observed 4.5 min once and >10 min the next time). Waiting longer
          # costs nothing when the queue is short.
          timeout: 1200000

      # deploy-pages reports success as long as the files synced — even when
      # they were published somewhere unreachable. A custom domain configured
      # in the repository's Pages settings silently moves the whole site off
      # /thinkingbreak/, which breaks every absolute URL the installers and
      # extensions hand out. Fail here rather than ship a green run whose site
      # nobody can load.
      - name: Assert the site published to the expected URL
        id: url
        env:
          PUBLISHED: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: https://doringber.github.io/thinkingbreak/
        run: |
          # Compare host and path only. Right after a custom domain is cleared
          # GitHub reports the URL as http:// until HTTPS enforcement is back,
          # and that scheme difference is not a misconfiguration.
          normalise() { printf '%s' "${1#http*://}"; }
          echo "published: $PUBLISHED"
          echo "expected:  $EXPECTED"
          # Always hand the https form to anything that loads the page.
          echo "url=https://$(normalise "$PUBLISHED")" >> "$GITHUB_OUTPUT"
          if [ "$(normalise "$PUBLISHED")" != "$(normalise "$EXPECTED")" ]; then
            {
              echo "### Pages published to the wrong URL"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| published | \`$PUBLISHED\` |"
              echo "| expected  | \`$EXPECTED\` |"
              echo ""
              echo "This almost always means a **custom domain** is set under"
              echo "Settings → Pages. Clear that field to serve the site at the"
              echo "default URL, or update these to match the new host:"
              echo "- \`DEFAULT_GAME_URL\` in \`extensions/shared/activation.ts\`"
              echo "- the URLs in \`install.sh\`, \`install-terminal.sh\`, \`uninstall.sh\`"
              echo "- \`BASE_URL\` in \`tools/verify-paths.js\`"
              echo "- the links in \`index.html\` and \`README.md\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Pages published to the wrong URL::Got '$PUBLISHED', expected '$EXPECTED'. A custom domain in Settings → Pages moves the site off /thinkingbreak/ and breaks every absolute URL. See the run summary."
            exit 1
          fi
          echo "✓ site is live at $PUBLISHED"

      # A synced artifact is not a working site: the modules still have to
      # resolve under the base path and the game still has to boot. Load the
      # real URL in a real browser and check that it does.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install a browser for the live check
        run: |
          npm i --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify the live site in a real browser
        run: node tools/verify-live.js "${{ steps.url.outputs.url }}"
